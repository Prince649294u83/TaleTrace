[pytest]
# The suite is `tests/` only. Without this, a bare `pytest` also collects
# `backend/app/OCRandGESTURE/`, which is the reference implementation kept as the
# functional specification for the migration — its own tests reach for the real
# ESP32 over HTTP and the real Vision key, so collection hangs on a device poll
# that never answers. Those files are read, not run.
testpaths = tests

# Explicit rather than auto: an async test that silently never ran would look
# exactly like one that passed.
asyncio_mode = strict
